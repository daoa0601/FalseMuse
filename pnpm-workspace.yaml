# Keep every workspace package inside this directory: cf 1.0.0-beta.12 never finishes `cf build`
# when a workspace package lies outside it.
packages:
  - "."

auditLevel: high
blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
nodeVersion: 22.22.2
pmOnFail: error
savePrefix: ""
strictDepBuilds: true
strictPeerDependencies: true
verifyDepsBeforeRun: error

allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  "@google/genai": false
  protobufjs: false

# Security floors (CVE audit 2026-10-24): zod GHSA-mrhx-c7xc-m3w5, sharp GHSA-wq5f-xc86-pv6w.
overrides:
  "zod@<4.6.6": "4.6.7"
  "sharp@<0.35.5": "0.35.5"
